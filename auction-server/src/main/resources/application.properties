# Auction System Configuration
# Email Configuration
email.from=your-email@gmail.com
email.password=your-app-password
smtp.host=smtp.gmail.com
smtp.port=587
email.max.retries=3

# Password Reset Configuration
token.expiration.minutes=60
password.min.length=8

# Rate Limiting Configuration (for forgot password)
rate.limit.requests=5
rate.limit.window.minutes=5

# Note: For production, use environment variables instead:
# AUCTION_EMAIL_FROM
# AUCTION_EMAIL_PASSWORD
# AUCTION_SMTP_HOST
# AUCTION_SMTP_PORT
# AUCTION_EMAIL_MAX_RETRIES
# AUCTION_TOKEN_EXPIRATION_MINUTES
