name: Java CI/CD with Maven and Checkstyle

# Cấu hình robot tự động chạy khi có code đẩy lên nhánh main hoặc master
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest # Robot sẽ dùng hệ điều hành Linux ảo

    steps:
      # Bước 1: Copy code từ kho GitHub về máy ảo
      - name: Checkout Code
        uses: actions/checkout@v4

      # Bước 2: Cài đặt Java (Khớp với version trong máy của bạn)
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21' # Bạn có thể sửa thành '25' nếu GitHub hỗ trợ bản Java 25 của bạn
          distribution: 'temurin'
          cache: maven # Lưu cache lại để lần sau chạy nhanh hơn

      # Bước 3: Chạy lệnh Maven để đóng gói và kiểm tra Checkstyle
      - name: Build and Checkstyle with Maven
        run: mvn clean install